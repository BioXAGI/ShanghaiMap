name: Discover 2026 China food videos
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline fixture tests
        run: python -m unittest discover -s tests -v
      - name: Query YouTube and aggregate comment clues
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/discover_youtube.py --max-searches 8 --comments-per-video 50
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-candidates-2026
          path: data/youtube_candidates.json
          retention-days: 7
